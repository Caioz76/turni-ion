<style>
  :root {
    --paper: #F5F1E6;
    --paper-2: #EFE9D8;
    --ink: #23211D;
    --ink-soft: #5B564A;
    --navy: #223349;
    --accent: #2F6F62;
    --accent-2: #3E8C7A;
    --alert: #B13B2E;
    --alert-bg: #F6E1DC;
    --line: #D8CDB2;
    --line-strong: #B9AC87;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    min-height: 100dvh;
    touch-action: manipulation;
    padding-bottom: calc(78px + var(--safe-b));
  }

  .update-banner {
    background: var(--accent-2);
    color: #fff;
    padding: calc(9px + var(--safe-t)) 16px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
  }
  .update-banner.hidden { display: none; }
  .update-banner button {
    background: #fff;
    color: var(--navy);
    border: none;
    border-radius: 16px;
    padding: 7px 14px;
    font-weight: 700;
    font-size: 13px;
    min-height: 32px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .auto-toast {
    position: fixed;
    bottom: calc(78px + var(--safe-b) + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 12.5px;
    z-index: 70;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    max-width: 85%;
    text-align: center;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .auto-toast.hidden { display: none; }

  header.m-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--navy);
    color: #EFE9DA;
    padding: calc(10px + var(--safe-t)) 14px 10px;
