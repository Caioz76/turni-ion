<style>
  :root {
    --paper: #F5F1E6;
    --paper-2: #EFE9D8;
    --ink: #23211D;
    --ink-soft: #5B564A;
    --navy: #223349;
    --accent: #2F6F62;
    --accent-2: #3E8C7A;
    --alert: #B13B2E;
    --alert-bg: #F6E1DC;
    --line: #D8CDB2;
    --line-strong: #B9AC87;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    min-height: 100dvh;
    touch-action: manipulation;
    padding-bottom: calc(78px + var(--safe-b));
  }

  .update-banner {
    background: var(--accent-2);
    color: #fff;
    padding: calc(9px + var(--safe-t)) 16px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
  }
  .update-banner.hidden { display: none; }
  .update-banner button {
    background: #fff;
    color: var(--navy);
    border: none;
    border-radius: 16px;
    padding: 7px 14px;
    font-weight: 700;
    font-size: 13px;
    min-height: 32px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .auto-toast {
    position: fixed;
    bottom: calc(78px + var(--safe-b) + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 12.5px;
    z-index: 70;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    max-width: 85%;
    text-align: center;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .auto-toast.hidden { display: none; }

  header.m-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--navy);
    color: #EFE9DA;
    padding: calc(10px + var(--safe-t)) 14px 10px;
  }
  .m-brand {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .m-brand .accent { color: var(--accent-2); }
  .m-header-badges { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .m-cloud-indicator {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 2px 7px;
    color: #EFE9DA;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .m-cloud-indicator.synced { border-color: var(--accent-2); color: #B3E0D6; }
  .m-cloud-indicator.syncing { animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
  .m-version {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 500;
    color: #8FA0AE;
    padding-left: 4px;
  }
  .settings-app-version {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 18px;
  }
  .m-week-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .m-arrow {
    background: rgba(255,255,255,0.08);
    border: 1px solid #4C617A;
    color: #EFE9DA;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .m-arrow:active { background: rgba(255,255,255,0.2); }
  .m-week-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    min-width: 150px;
    text-align: center;
    background: none;
    border: none;
    color: inherit;
    padding: 6px 4px;
    cursor: pointer;
  }
  .m-week-label:active { opacity: 0.7; }

  .m-substatus {
    display: flex;
    align-items: center;
    justify-content: center;

    margin-top: 9px;
    flex-wrap: wrap;

  .m-stamp {

    font-weight: 700;

    color: var(--accent-2);
    padding: 4px 10px;
    border-radius: 12px;
    text-transform: uppercase;
  }
  .m-stamp.alert { border-color: #E38C7C; color: #E38C7C; }
  .m-link {
    background: none;
    border: none;
    color: #B8C0CB;
    font-size: 12px;
    text-decoration: underline;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
  }

  main.m-main { padding: 14px 12px 20px; max-width: 900px; margin: 0 auto; }
  .m-conflict {

    border: 1px solid #E2B4AA;
    border-left: 4px solid var(--alert);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .m-conflict.hidden { display: none; }

  .m-conflict li { margin-bottom: 3px; }

  .m-gap {

    border-left: 4px solid #B8860B;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .m-gap.hidden { display: none; }
  .m-gap h3 { margin: 0 0 6px; font-family: 'Fraunces', serif; font-size: 14px; color: #8A6209; }
  .m-gap ul { margin: 0; padding-left: 18px; }
  .m-gap li { margin-bottom: 3px; }

  .day-card {
    background: #FFFEFB;
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(35,33,29,0.07);

  .day-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

  .day-badge .name { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--ink-soft); letter-spacing: 1px; }

  .agency-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  @media(min-width: 680px) {
    .agency-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .agency-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--navy);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .shift-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-height: 46px;
    text-align: left;
    border: 1.4px solid var(--line-strong);
    border-radius: 10px;
    padding: 7px 9px;
    margin-top: 6px;
    background: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
  }
  .shift-btn:active { background: var(--paper-2); }
  .shift-btn.conflict { border-color: var(--alert); background: var(--alert-bg); }
  .shift-btn.closed { background: var(--line); opacity: 0.6; cursor: not-allowed; }
  .shift-btn.closed:active { background: var(--line); }
  .shift-tag { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; text-transform: uppercase; color: var(--ink-soft); letter-spacing: .5px; }
  .shift-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .empty-hint { color: #C6BC9E; font-size: 11px; font-style: italic; margin-top: 4px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1.4px solid var(--line-strong);
    border-radius: 10px;
    padding: 2px 7px 2px 5px;
    font-size: 11px;
    color: var(--ink);
  }
  .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .chip.chip-absent { border-style: dashed; }

  .ferie-btn {
    width: 100%;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border: 1.4px dashed var(--line-strong);
    border-radius: 10px;
    padding: 9px 11px;
    background: var(--paper-2);
    min-height: 46px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    cursor: pointer;
  }
  .ferie-btn .fchips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .ferie-btn:active { background: var(--line); }
  .closed-btn { border-color: #DFC48B; background: #F5EAD2; }
  .closed-btn:active { background: #EBD8AC; }

  .month-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
  .month-nav button {
    background: var(--paper-2);
    border: 1px solid var(--line-strong);
    border-radius: 50%;
